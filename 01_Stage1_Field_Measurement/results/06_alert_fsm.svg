<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img"><rect width="680" height="400" fill="#FFFFFF"/><g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="24" font-size="14" font-weight="500" fill="#2C2C2A">声学超标自动提醒光效逻辑 · 状态机</text><rect x="24.0" y="92" width="132" height="84" rx="10" fill="#2f9e44" fill-opacity="0.10" stroke="#2f9e44" stroke-width="1.8"/><text x="90.0" y="116" font-size="13" font-weight="700" fill="#2f9e44" text-anchor="middle">QUIET</text><text x="90.0" y="134" font-size="10" fill="#2C2C2A" text-anchor="middle">绿色常亮（低亮度）</text><text x="90.0" y="150" font-size="9" fill="#5F5E5A" text-anchor="middle">连续 5 帧 &lt;</text><text x="90.0" y="162" font-size="9" fill="#5F5E5A" text-anchor="middle"> 阈值−12 dB</text><rect x="190.7" y="92" width="132" height="84" rx="10" fill="#1971c2" fill-opacity="0.10" stroke="#1971c2" stroke-width="1.8"/><text x="256.7" y="116" font-size="13" font-weight="700" fill="#1971c2" text-anchor="middle">NORMAL</text><text x="256.7" y="134" font-size="10" fill="#2C2C2A" text-anchor="middle">蓝色常亮</text><text x="256.7" y="150" font-size="9" fill="#5F5E5A" text-anchor="middle">连续 5 帧回落滞回带</text><rect x="357.3" y="92" width="132" height="84" rx="10" fill="#f08c00" fill-opacity="0.10" stroke="#f08c00" stroke-width="1.8"/><text x="423.3" y="116" font-size="13" font-weight="700" fill="#f08c00" text-anchor="middle">WARN</text><text x="423.3" y="134" font-size="10" fill="#2C2C2A" text-anchor="middle">黄色慢闪 1 Hz</text><text x="423.3" y="150" font-size="9" fill="#5F5E5A" text-anchor="middle">连续 3 帧 ≥ 阈值</text><rect x="524.0" y="92" width="132" height="84" rx="10" fill="#e5484d" fill-opacity="0.10" stroke="#e5484d" stroke-width="1.8"/><text x="590.0" y="116" font-size="13" font-weight="700" fill="#e5484d" text-anchor="middle">ALERT</text><text x="590.0" y="134" font-size="10" fill="#2C2C2A" text-anchor="middle">红色快闪 2 Hz + 蜂鸣</text><text x="590.0" y="150" font-size="9" fill="#5F5E5A" text-anchor="middle">连续 3 帧 ≥</text><text x="590.0" y="162" font-size="9" fill="#5F5E5A" text-anchor="middle"> 阈值+6 dB</text><line x1="160.0" y1="66.0" x2="184.7" y2="66.0" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="184.7,66.0 177.4,69.3 177.4,62.7" fill="#C2410C"/><text x="172.3" y="59.0" font-size="9" fill="#C2410C" text-anchor="middle">回落滞回带</text><line x1="326.7" y1="66.0" x2="351.3" y2="66.0" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="351.3,66.0 344.0,69.3 344.0,62.7" fill="#C2410C"/><text x="339.0" y="59.0" font-size="9" fill="#C2410C" text-anchor="middle">连续 3 帧超阈</text><line x1="493.3" y1="66.0" x2="518.0" y2="66.0" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="518.0,66.0 510.7,69.3 510.7,62.7" fill="#C2410C"/><text x="505.7" y="59.0" font-size="9" fill="#C2410C" text-anchor="middle">连续 3 帧超阈 +6</text><line x1="520.0" y1="202.0" x2="495.3" y2="202.0" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="495.3,202.0 502.6,198.7 502.6,205.3" fill="#0F766E"/><text x="507.7" y="215.0" font-size="9" fill="#0F766E" text-anchor="middle">连续 5 帧回落</text><line x1="353.3" y1="202.0" x2="328.7" y2="202.0" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="328.7,202.0 336.0,198.7 336.0,205.3" fill="#0F766E"/><text x="341.0" y="215.0" font-size="9" fill="#0F766E" text-anchor="middle">连续 5 帧回落</text><line x1="186.7" y1="202.0" x2="162.0" y2="202.0" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="162.0,202.0 169.3,198.7 169.3,205.3" fill="#0F766E"/><text x="174.3" y="215.0" font-size="9" fill="#0F766E" text-anchor="middle">连续 5 帧 &lt; −12</text><rect x="357.3" y="230" width="132" height="40" rx="8" fill="#7C2D12" fill-opacity="0.08" stroke="#7C2D12" stroke-width="1.2" stroke-dasharray="4 3"/><text x="423.3" y="246" font-size="10" font-weight="600" fill="#7C2D12" text-anchor="middle">峰值 ≥ 阈值+10 dB</text><text x="423.3" y="260" font-size="9" fill="#5F5E5A" text-anchor="middle">不改变主状态</text><line x1="24" y1="378" x2="46" y2="378" stroke="#C2410C" stroke-width="1.5" /><text x="52" y="381" font-size="9" fill="#5F5E5A">升级路径（连续 3 帧确认）</text><line x1="24" y1="393" x2="46" y2="393" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3"/><text x="52" y="396" font-size="9" fill="#5F5E5A">降级路径（连续 5 帧 + 滞回带）</text><line x1="24" y1="408" x2="46" y2="408" stroke="#7C2D12" stroke-width="1.5" /><text x="52" y="411" font-size="9" fill="#5F5E5A">瞬时事件（单次触发）</text><text x="656" y="408" font-size="9" fill="#5F5E5A" text-anchor="end">实现见 analyze_noise.py 的 LightAlertFSM（可运行代码）</text></g></svg>